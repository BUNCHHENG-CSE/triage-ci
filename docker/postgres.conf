# ========================================================
# TriageCI Production-Optimized PostgreSQL Configuration
# Optimized for Webhook Ingestion & Rapid Log Attribution
# ========================================================

# Connection Settings
listen_addresses = '*'
max_connections = 100

# Memory Optimization
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# Write-Ahead Logging (WAL) & Checkpoints
wal_buffers = 16MB
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9

# Query Planner & Cost Optimization (SSD / NVMe tuned)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Background Writer
bgwriter_delay = 20ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# Query Logging & Diagnostics
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 200 # Log queries exceeding 200ms
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
